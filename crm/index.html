<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1a2e">
<title>DSA Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Corporate desk layout: fixed navy rail, cool-grey canvas, white ledgers; gold reserved for the brand mark. */
:root{
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --brand:#1d4f91;--brand-2:#163e73;--brand-soft:#e9f0fa;--gold:#b88a2e;--gold-soft:#f6efe0;
  --ink:#0f1b2d;--ink-2:#36465c;--muted:#66758a;--line:#dfe5ed;--line-2:#cfd8e3;
  --bg:#f2f4f7;--card:#ffffff;--surface-2:#f7f9fb;--hover:#f3f6fa;--track:#e8edf3;--input:#ffffff;
  --side:#0c1a2e;--side-2:#12243d;--side-ink:#a9b6c8;--side-strong:#ffffff;--side-line:rgba(255,255,255,.08);
  --ok:#0f7a4f;--ok-bg:#e8f5ee;--ok-strong:#13855a;--warn:#9a5b06;--warn-bg:#fdf3e2;--warn-strong:#c27a12;
  --bad:#b42318;--bad-bg:#fdecea;--bad-strong:#d03b2d;--info:#1d4f91;--info-bg:#e9f0fa;
  --wa:#1f8f4e;--wa-2:#187a42;--wa-canvas:#ece5dd;--wa-bubble:#d9fdd3;--wa-ink:#111b21;--wa-meta:#667781;
  --draft-bg:#eef8f1;--draft-line:#c9e9d4;--draft-ink:#1b4d32;
  --avatar-bg:#e3eaf5;--avatar-fg:#163e73;--toast:#0f1b2d;--overlay:rgba(12,26,46,.5);
  --r:8px;--shadow:0 1px 2px rgba(15,27,45,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#5b8fd6;--brand-2:#7aa6e3;--brand-soft:#16263d;--gold:#d4a748;--gold-soft:#2a2414;
  --ink:#e6ebf2;--ink-2:#c3cddb;--muted:#8d9bb0;--line:#243246;--line-2:#2f3f56;
  --bg:#0a121e;--card:#101b2b;--surface-2:#132033;--hover:#16243a;--track:#1c2a3f;--input:#0e1828;
  --side:#070e19;--side-2:#0d1828;--side-ink:#8fa0b8;--side-strong:#f1f4f9;--side-line:rgba(255,255,255,.07);
  --ok:#4cc38a;--ok-bg:#0f2a1f;--ok-strong:#3fb37d;--warn:#e7b25c;--warn-bg:#2d2312;--warn-strong:#e0a040;
  --bad:#f08b80;--bad-bg:#33171a;--bad-strong:#e5645a;--info:#7aa6e3;--info-bg:#16263d;
  --wa:#2aa862;--wa-2:#23944f;--wa-canvas:#0e1a17;--wa-bubble:#144d37;--wa-ink:#e9edef;--wa-meta:#9ab0a7;
  --draft-bg:#0f2219;--draft-line:#1f4a33;--draft-ink:#a9dcbf;
  --avatar-bg:#1b2c45;--avatar-fg:#a9c4ea;--toast:#1d2c42;--overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#5b8fd6;--brand-2:#7aa6e3;--brand-soft:#16263d;--gold:#d4a748;--gold-soft:#2a2414;
  --ink:#e6ebf2;--ink-2:#c3cddb;--muted:#8d9bb0;--line:#243246;--line-2:#2f3f56;
  --bg:#0a121e;--card:#101b2b;--surface-2:#132033;--hover:#16243a;--track:#1c2a3f;--input:#0e1828;
  --side:#070e19;--side-2:#0d1828;--side-ink:#8fa0b8;--side-strong:#f1f4f9;--side-line:rgba(255,255,255,.07);
  --ok:#4cc38a;--ok-bg:#0f2a1f;--ok-strong:#3fb37d;--warn:#e7b25c;--warn-bg:#2d2312;--warn-strong:#e0a040;
  --bad:#f08b80;--bad-bg:#33171a;--bad-strong:#e5645a;--info:#7aa6e3;--info-bg:#16263d;
  --wa:#2aa862;--wa-2:#23944f;--wa-canvas:#0e1a17;--wa-bubble:#144d37;--wa-ink:#e9edef;--wa-meta:#9ab0a7;
  --draft-bg:#0f2219;--draft-line:#1f4a33;--draft-ink:#a9dcbf;
  --avatar-bg:#1b2c45;--avatar-fg:#a9c4ea;--toast:#1d2c42;--overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 var(--font-ui);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num,.kpi .v,.res .amt,td.nowrap,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-num);font-size:12.5px}
.layout{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:10px;overflow-y:auto;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 12px;color:var(--side-strong);font-weight:700;font-size:14px;line-height:1.2;border-bottom:1px solid var(--side-line)}
.brand .logo{width:36px;height:36px;border-radius:6px;background:var(--gold);display:grid;place-items:center;color:#0c1a2e;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none}
.brand small{display:block;font-weight:500;color:var(--side-ink);font-size:11px;margin-top:2px;letter-spacing:.01em}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-ink);opacity:.65;padding:14px 10px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--side-ink);font-weight:500;font-size:13.5px;border-left:2px solid transparent}
.nav a:hover{background:var(--side-2);color:var(--side-strong);text-decoration:none}
.nav a.active{background:var(--side-2);color:var(--side-strong);border-left-color:var(--gold);font-weight:600}
.nav a .count{margin-left:auto;background:var(--bad-strong);color:#fff;border-radius:4px;font-size:11px;padding:0 6px;font-weight:700;font-variant-numeric:tabular-nums}
.mode{font-size:11.5px;padding:8px 10px;border-radius:6px;background:var(--side-2);margin-top:auto;line-height:1.45}
.mode b{color:var(--side-strong)}
.me{border-top:1px solid var(--side-line);padding:12px 6px 0;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--avatar-bg);color:var(--avatar-fg);display:grid;place-items:center;font-weight:700;flex:none;font-size:12.5px}
.me .avatar{background:var(--side-2);color:var(--side-strong);box-shadow:inset 0 0 0 1px var(--side-line)}
.me .who{min-width:0;flex:1}
.me .who b{display:block;color:var(--side-strong);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:11.5px}
.me .icon-btn{color:var(--side-ink)}
.me .icon-btn:hover{background:var(--side-2);color:var(--side-strong)}
.main{padding:0 28px 48px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));min-width:0}
.appbar{display:flex;align-items:center;gap:12px;height:48px;margin:0 -28px 20px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--muted);position:sticky;top:env(safe-area-inset-top, 0px);z-index:20}
.appbar .crumb b{color:var(--ink);font-weight:600}
.appbar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.appbar .pill{border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--ink-2);font-weight:600;font-size:11.5px;letter-spacing:.02em}
.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;letter-spacing:-.015em;font-weight:700}
.top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
.card .sub{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
.grid{display:grid;gap:16px;align-content:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.kpis .kpi{border:0;border-radius:0;box-shadow:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi{padding:14px 18px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-family:var(--font-num);font-size:24px;font-weight:600;margin-top:4px;letter-spacing:-.02em;color:var(--ink)}
.kpi .h{font-size:12px;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:6px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{padding:6px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--muted);display:inline-flex;font:inherit}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--track);color:var(--ink-2)}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
tr.click{cursor:pointer}
.muted{color:var(--muted)}.small{font-size:12px}.strong{font-weight:600}.nowrap{white-space:nowrap}.right{text-align:right}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;font:inherit;color:var(--ink);background:var(--input)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;padding:0;accent-color:var(--brand);flex:none}
input[disabled]{background:var(--surface-2);color:var(--muted)}
input[type=file]{padding:6px;background:var(--surface-2)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{padding-left:32px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:15px;height:15px}
.toolbar select{width:auto}
.empty{padding:26px;text-align:center;color:var(--muted)}
.empty svg{width:28px;height:28px;margin-bottom:6px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;border:1px solid var(--line)}
.notice svg{margin-top:2px}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.notice.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:118px 1fr 28px;gap:10px;align-items:center;font-size:12.5px}
.bar .t{height:8px;background:var(--track);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brand);border-radius:2px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--track);color:var(--ink-2);display:inline-flex;align-items:center}
.chip.up{background:var(--ok-bg);color:var(--ok)}
.res{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--ok-strong);background:var(--card)}
.res.partial{border-top-color:var(--warn-strong)}
.res .amt{font-family:var(--font-num);font-size:22px;font-weight:600;letter-spacing:-.02em}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bk{display:flex;flex-direction:column;gap:9px}
.bk .row{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
.steps{margin:0;padding-left:18px;color:var(--ink-2)}
.steps li{margin:4px 0}
.excerpt{font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:74px;overflow:hidden;background:var(--surface-2);border-radius:4px;padding:6px 8px;margin-top:6px;max-width:520px}
.modal-back{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto;z-index:60}
.modal{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(1040px,100%)}
.modal header{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:16px;flex:1;font-weight:700}
.modal .body{padding:18px 20px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;flex-wrap:wrap}
#toast-root{position:fixed;right:max(18px, env(safe-area-inset-right, 0px));bottom:max(18px, env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--toast);color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:360px;border-left:3px solid var(--gold)}
.toast.bad{border-left-color:var(--bad-strong)}.toast.ok{border-left-color:var(--ok-strong)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--side)}
.login .card{width:min(440px,100%);padding:28px;border-top:3px solid var(--gold)}
.login .brand{color:var(--ink);padding:0 0 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.login .brand small{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.phone{display:flex}
.phone span{padding:8px 10px;border:1px solid var(--line-2);border-right:0;border-radius:6px 0 0 6px;background:var(--surface-2);font-weight:600;color:var(--ink-2)}
.phone input{border-radius:0 6px 6px 0}
.otp{letter-spacing:.5em;text-align:center;font-size:20px;font-weight:700;font-family:var(--font-num)}
.err{background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:6px;font-size:13px;margin-top:14px}
.demo-users{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.demo-users button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font:inherit;color:var(--ink)}
.demo-users button:hover{border-color:var(--brand);background:var(--brand-soft)}
.backdrop{display:none}
.wa-wrap{background:var(--wa-canvas);border-radius:8px;padding:16px;min-height:220px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wa-bubble{background:var(--wa-bubble);border-radius:8px 0 8px 8px;padding:9px 12px;max-width:95%;white-space:pre-wrap;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.08);color:var(--wa-ink)}
.wa-bubble .tm{display:block;text-align:right;font-size:11px;color:var(--wa-meta);margin-top:4px}
.draft{margin-top:8px;background:var(--draft-bg);border:1px solid var(--draft-line);border-radius:6px;padding:8px 10px;font-size:12.5px;white-space:pre-wrap;max-height:66px;overflow:hidden;color:var(--draft-ink)}
.draft-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.sec-h{grid-column:1/-1;font-weight:700;font-size:11.5px;color:var(--brand);margin-top:6px;padding-top:14px;border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.09em}
.loan-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--surface-2)}
.loan-row .c2{grid-column:span 2}
.alert-red{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-strong);border-left:5px solid var(--bad-strong);border-radius:6px;padding:9px 12px;margin-bottom:8px;font-size:13px}
.alert-red b{display:block}
.ph-hist td{vertical-align:top}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.cal button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);font:inherit}
.cal button:hover{background:var(--hover)}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--brand)}
.cal button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.cal button .n{font-family:var(--font-num);font-size:11px;padding:0 6px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.cal button.future .n{background:var(--warn-bg);color:var(--warn)}
.cal button.sel .n{background:rgba(255,255,255,.25);color:#fff}
[data-hov]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
#hov-card{position:fixed;z-index:200;max-width:440px;width:calc(100vw - 32px);max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;font-size:12.5px}
#hov-card table{font-size:12px}
.login-row{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--surface-2)}
.login-row .lg-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px}
.login-row .lg-grid+.lg-grid{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.login-row .c2{grid-column:span 2}
.login-row label{font-size:11px;margin-bottom:2px}
.login-row .lg-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:13px}
.loan-row label{font-size:11px;margin-bottom:2px}
.loan-row .st{display:flex;align-items:flex-end;justify-content:flex-end;gap:4px;flex-wrap:wrap}
input.auto,input[readonly]{background:var(--track);color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.loan-grid{display:grid;grid-template-columns:28px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.loan-grid .h{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.loan-grid .n{font-weight:700;color:var(--muted);text-align:right}
.checks{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.doc-slot{border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.doc-slot.have{border-color:var(--draft-line);background:var(--ok-bg);color:var(--ok)}
.doc-slot .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
.doc-slot.have .dot{background:var(--ok-strong)}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:16px;background:var(--surface-2)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:860px){
  .loan-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loan-row .c2{grid-column:span 2}
  .login-row .lg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loan-grid{grid-template-columns:22px 1fr 1fr}
  .loan-grid .lt{grid-column:2/-1}
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s;padding-top:max(16px, env(safe-area-inset-top, 0px))}
  .side.open{transform:none}
  .backdrop.show{display:block;position:fixed;inset:0;background:var(--overlay);z-index:45}
  .menu-btn{display:inline-flex!important}
  .main{padding:0 16px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .appbar{margin:0 -16px 16px;padding:0 16px}
  .appbar .hide-sm{display:none}
  .g2{grid-template-columns:1fr}
  .top .actions{margin-left:0;width:100%}
  .modal-back{padding:16px 10px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.top .actions,.no-print,.menu-btn,#toast-root,.backdrop,.appbar{display:none!important}
  .layout{display:block}.main{padding:0}.split{display:block}
  .card{box-shadow:none;break-inside:avoid;margin-bottom:12px}body{background:#fff;color:#000}
}

const parseDay = v => { const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? {y: +m[1], m: +m[2], d: +m[3]} : null; };

const addMonths = (v, n) => { const p = parseDay(v); return p ? ymd(p.y, p.m - 1 + n, p.d) : ''; };
const addDays = (v, n) => { const p = parseDay(v); return p ? localDay(new Date(p.y, p.m - 1, p.d + n)) : ''; };
const daysUntil = v => { const p = parseDay(v); if (!p) return Infinity; const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(p.y, p.m - 1, p.d) - t) / 864e5); };
const inDays = n => n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 0 ? `${-n}d overdue` : `in ${n} days`;
// EMI schedule from the 1st EMI date and tenure: everything else is calculated
function emiInfo(x) {
  const n = Math.floor(num(x?.tenure)), first = x?.firstEmiDate;
  if (!parseDay(first) || n < 1) return null;
  const today = todayStr(); let paid = 0;
  while (paid < n && addMonths(first, paid) <= today) paid++;
  return {last: addMonths(first, n - 1), paid, pending: n - paid, next: paid < n ? addMonths(first, paid) : '', closed: paid >= n, tenure: n};
}
function loanSummary(loans = []) {
  const since = addMonths(todayStr(), -3), s = {count: loans.length, emiTotal: 0, closingCount: 0, closingEmi: 0, recentCount: 0, recentEmi: 0, closedCount: 0};
  for (const x of loans) {
    const e = emiInfo(x), emi = num(x.emi);
    if (e?.closed) { s.closedCount++; continue; }
    s.emiTotal += emi;
    if (e && e.pending <= 6) { s.closingCount++; s.closingEmi += emi; }
    const start = x.disbDate || (x.firstEmiDate ? addMonths(x.firstEmiDate, -1) : '');
    if (start && start >= since) { s.recentCount++; s.recentEmi += emi; }
  }
  return s;
}
// Next monthly touch for a rejected file: 3 days before the customer's next existing-loan EMI date
// (when the EMI pinch is felt), otherwise 30 days later.
function nextTouch(l, from) {
  const cands = [];
  for (const x of l.loans || []) {
    const e = emiInfo(x); if (!e || e.closed) continue;
    const day = parseDay(x.firstEmiDate).d, f = parseDay(from);
    for (let k = 0; k < 3; k++) { const c = addDays(ymd(f.y, f.m - 1 + k, day), -3); if (c > from) { cands.push(c); break; } }
  }
  return cands.sort()[0] || addDays(from, 30);
}
const retryFromDate = (at, reasons) => addMonths(dayOf(at) || todayStr(), Math.max(1, ...(reasons || []).map(r => (REJECT_REASONS.find(x => x[0] === r) || [0, 1])[1])));

  if (e?.code === 'permission-denied') return "You don't have permission to do that.";

// Firestore cannot store a list directly inside a list (e.g. policy history keeps [old, new] pairs).
// Wrap inner lists as {__a: [...]} on save and unwrap them on load; the rest of the app never sees this.
const fsEnc = v => Array.isArray(v) ? v.map(x => Array.isArray(x) ? {__a: fsEnc(x)} : fsEnc(x))
  : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsEnc(x)])) : v;
const fsDec = v => Array.isArray(v) ? v.map(fsDec)
  : (v && typeof v === 'object') ? (Array.isArray(v.__a) && Object.keys(v).length === 1 ? fsDec(v.__a) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsDec(x)]))) : v;

// Policies saved by the old Eligibility Engine use other field names (bankName, prodType, minVin…).

const LEGACY_PRODUCT = {TERM: 'Business Loan', UBL: 'Business Loan', HTBL: 'Business Loan', STBL: 'STBL', OD: 'Working Capital'};
function normLegacyPolicy(d) {
  if (d.bank || !d.bankName) return d;
  const n = v => (v === '' || v == null || isNaN(+v)) ? undefined : +v, yes = v => String(v || '').toLowerCase() === 'yes';
  const notes = [
    d.remarks, ...(d.conditions || []).map(c => c && c.name ? `${String(c.name).trim()}: ${c.val ?? ''}` : ''),
    ...(d.programs || []).map(g => g && g.type ? `${g.type} program: ${g.val ?? ''} (₹${g.min ?? '?'}–${g.max ?? '?'} L)` : ''),
    d.bankingTypes?.length ? `Banking: ${d.bankingTypes.join(', ')}` : '',
    n(d.ageMin) || n(d.ageMax) ? `Age ${d.ageMin ?? '?'}–${d.ageMax ?? '?'}` : '',
    yes(d.coAppReq) ? `Co-applicant needed${n(d.coAgeMin) ? ` (age ${d.coAgeMin}–${d.coAgeMax ?? '?'})` : ''}` : '',
    yes(d.houseReq) ? `Own house needed${n(d.houseGeo) ? ` within ${d.houseGeo} km` : ''}` : '',
    n(d.maxEnq) ? `Max enquiries: ${d.maxEnq}` : '', n(d.maxActive) ? `Max active loans: ${d.maxActive}` : '', n(d.loans6m) ? `Max loans in 6 months: ${d.loans6m}` : '',
    n(d.pfMin) ? `PF ${d.pfMin}${n(d.pfMax) && +d.pfMax !== +d.pfMin ? `–${d.pfMax}` : ''}%` : '',
    d.pinScope === 'Specific List' && d.pinList ? `Serves ${String(d.pinList).split(/\s+/).filter(Boolean).length} PIN codes (list in old record)` : d.pinScope ? `Area: ${d.pinScope}` : '',
  ].filter(Boolean).join('\n');
  const out = {...d, bank: titleCase(String(d.bankName).trim()).replace(/\b(Gst|Abb|Od|Stbl|Ubl|Htbl|Itr|Bl|Lap|Sfb|Nbfc|Dscr)\b/g, m => m.toUpperCase()).replace(/\bL&t\b/g, 'L&T'), product: LEGACY_PRODUCT[String(d.prodType || '').toUpperCase()] || 'Business Loan', active: true, legacy: true,
    minCibil: n(d.minCibil), minVintageYrs: n(d.minVin), minTurnoverLakh: n(d.minTurn), minAbb: n(d.abbMin), loanMinLakh: n(d.loanMin), loanMaxLakh: n(d.loanMax),
    roiMin: n(d.roiMin), roiMax: n(d.roiMax), tenureMaxMonths: n(d.tenMax), itrRequired: yes(d.itrReq), gstRequired: yes(d.gstReq),
    geo: n(d.geoLimit) ? `${+d.geoLimit} km` : '', notes, source: 'Old Eligibility Engine', version: d.version || 1, history: d.history || []};
  Object.keys(out).forEach(k => out[k] === undefined && delete out[k]);
  return out;
}

class FireStoreAdapter {
  constructor(fb){ this.fb = fb; this.cache = {}; this.unsubs = []; this.listeners = new Set(); }
  onChange(f){ this.listeners.add(f); }
  emit(){ this.listeners.forEach(f => f()); }
  start(u){
    const {db, F} = this.fb; const col = n => F.collection(db, n); const r = u.role;
    const q = (n, field, val) => F.query(col(n), F.where(field, '==', val));
    const subs = {policies: col('policies'), bankers: col('bankers'), settings: col('settings')};
    if (['Admin','Operations'].includes(r)) Object.assign(subs, {leads:col('leads'), followups:col('followups'), documents:col('documents'), checks:col('checks'), calls:col('calls'), groups:col('groups'), imports:col('imports'), staff:col('staff')});
    else if (r === 'Branch Manager') Object.assign(subs, {leads:q('leads','branch',u.branch), followups:q('followups','branch',u.branch), documents:q('documents','branch',u.branch), checks:q('checks','branch',u.branch), calls:q('calls','branch',u.branch), staff:q('staff','branch',u.branch)});
    else if (r === 'Sales Executive') Object.assign(subs, {leads:q('leads','assignedTo',u.phone), followups:q('followups','assignedTo',u.phone), documents:q('documents','assignedTo',u.phone), checks:q('checks','createdBy',u.phone), calls:q('calls','createdBy',u.phone)});
    else Object.assign(subs, {checks:q('checks','createdBy',u.phone), calls:q('calls','createdBy',u.phone)});
    this.subs = subs; this.tries = {};
    for (const [name, ref] of Object.entries(subs)) this.listen(name, ref);
  }
  listen(name, ref) {
    const {F} = this.fb;
    const un = F.onSnapshot(ref,
        snap => { this.tries[name] = 0; this.cache[name] = snap.docs.map(d => { const o = {...fsDec(d.data()), id: d.id}; return name === 'policies' ? normLegacyPolicy(o) : o; }); this.emit(); },
        err => { console.error(name, err); const n = (this.tries[name] || 0) + 1; this.tries[name] = n;
          if (n <= 5) setTimeout(() => { if (this.subs) this.listen(name, ref); }, 2000 * n);   // reconnect: 2 s, 4 s, 6 s…
          else toast(`Could not load ${name} (${err.code}). Refresh the page.`, 'bad'); });
    this.unsubs.push(un);
  }
  // Re-open every listener (used when the tab becomes visible again after a long break)
  restart() { if (!this.subs) return; this.unsubs.forEach(u => u()); this.unsubs = []; for (const [n, r] of Object.entries(this.subs)) this.listen(n, r); }
  stop(){ this.unsubs.forEach(u => u()); this.unsubs = []; this.cache = {}; this.subs = null; }
  all(c){ return this.cache[c] || []; }
  async add(c,o){ const {db,F} = this.fb; const ref = await F.addDoc(F.collection(db,c), fsEnc(clone(o))); return {...o, id: ref.id}; }
  async set(c,id,o){ const {db,F} = this.fb; const d = clone(o); delete d.id; await F.setDoc(F.doc(db,c,id), fsEnc(d)); }
  async update(c,id,p){ const {db,F} = this.fb; const d = clone(p); delete d.id; await F.updateDoc(F.doc(db,c,id), fsEnc(d)); }
  async remove(c,id){ const {db,F} = this.fb; await F.deleteDoc(F.doc(db,c,id)); }
}

// ---------------------------------------------------------------------
// Eligibility logic
// ---------------------------------------------------------------------
const pmt = (roi, months, principal) => { const r = roi/1200; return r ? principal*r/(1 - Math.pow(1+r, -months)) : principal/months; };
const pv  = (roi, months, emi)       => { const r = roi/1200; return r ? emi*(1 - Math.pow(1+r, -months))/r : emi*months; };

// Credit rules for one lender. This is the place to tune house logic
// (e.g. ABB multiples, turnover-based caps, banking-surrogate programs).
function assessPolicy(c, p) {
  const reasons = [];
  if (num(p.minCibil) && c.cibil < num(p.minCibil)) reasons.push(`CIBIL ${c.cibil || '—'} < ${num(p.minCibil)}`);
  if (num(p.minVintageYrs) && c.vintage < num(p.minVintageYrs)) reasons.push(`Vintage ${c.vintage}y < ${num(p.minVintageYrs)}y`);
  if (num(p.minTurnoverLakh) && c.turnover < num(p.minTurnoverLakh)) reasons.push(`Turnover ${fmtL(c.turnover)} < ${fmtL(p.minTurnoverLakh)}`);
  if (num(p.minAbb) && c.abb < num(p.minAbb)) reasons.push(`ABB ${fmtINR(c.abb)} < ${fmtINR(p.minAbb)}`);
  if (p.itrRequired === true && !c.itr) reasons.push('ITR required');
  if (p.gstRequired === true && !c.gst) reasons.push('GST required');
  if (c.loanLakh && num(p.loanMinLakh) && c.loanLakh < num(p.loanMinLakh)) reasons.push(`Ask ${fmtL(c.loanLakh)} < lender min ${fmtL(p.loanMinLakh)}`);

  const maxTen = num(p.tenureMaxMonths) || 60;
  const tenure = c.tenure ? Math.min(c.tenure, maxTen) : maxTen;
  // Capacity is sized at the lender's highest ROI so the estimate stays conservative.
  const roiCap = num(p.roiMax) || num(p.roiMin) || 18;
  const foir = (num(p.foirMax) || 50) / 100;
  const emiRoom = Math.max(0, c.monthlyIncome * foir - c.existingEmi);
  let eligibleLakh = pv(roiCap, tenure, emiRoom) / 1e5;
  if (num(p.loanMaxLakh)) eligibleLakh = Math.min(eligibleLakh, num(p.loanMaxLakh));

  if (!c.monthlyIncome) reasons.push('Income not entered');
  else if (emiRoom <= 0) reasons.push('No EMI room after existing EMIs');
  else if (num(p.loanMinLakh) && eligibleLakh < num(p.loanMinLakh)) reasons.push(`Eligible ${fmtL(eligibleLakh)} < lender min ${fmtL(p.loanMinLakh)}`);

  const offerLakh = c.loanLakh ? Math.min(c.loanLakh, eligibleLakh) : eligibleLakh;
  const emi = pmt(num(p.roiMin) || roiCap, tenure, offerLakh*1e5);
  const status = reasons.length ? 'Declined' : (c.loanLakh && eligibleLakh < c.loanLakh ? 'Partial' : 'Eligible');
  return {status, reasons, eligibleLakh: r2(eligibleLakh), offerLakh: r2(offerLakh), tenure, emi, emiRoom};
}

function runEligibility(F) {
  const monthly = num(F.monthlyIncome) || num(F.itrIncome)/12;
  const input = {
    name: clip(F.name,80), phone: e164(F.phone), city: clip(F.city,40), product: F.product, leadId: F.leadId || '',
    loanLakh: num(F.loanLakh), tenure: num(F.tenure), cibil: num(F.cibil), vintage: num(F.vintage),
    turnover: num(F.turnover), monthlyIncome: monthly, existingEmi: num(F.existingEmi), abb: num(F.abb),
    itr: F.itr === 'Yes', gst: F.gst === 'Yes',
  };
  const rank = {Eligible:0, Partial:1, Declined:2};
  const items = S.all('policies').filter(p => p.active !== false && p.product === input.product)
    .map(p => ({p, city: input.city, ...assessPolicy(input, p)}))
    .sort((a,b) => rank[a.status] - rank[b.status] || b.offerLakh - a.offerLakh);
  return {input, items, at: nowISO()};
}

// ---------------------------------------------------------------------
// Policy versioning — every change keeps a history entry with a diff
// ---------------------------------------------------------------------
const findPolicy = (bank, product) => S.all('policies').find(p => String(p.bank).toLowerCase() === String(bank).toLowerCase() && p.product === product);
const isStale = p => daysSince(p.asOf || p.updatedAt) > settings().staleDays;

function policyDiff(ex, fields, clearEmpty) {
  const changes = {};
  for (const [k, v] of Object.entries(fields)) {
    if (v === undefined) continue;
    if ((v === null || v === '') && !clearEmpty) continue;
    const o = ex?.[k] ?? null, n = v === '' ? null : v;
    if (String(o ?? '') !== String(n ?? '')) changes[k] = [o, n];
  }
  return changes;
}
async function applyPolicyChange(ex, fields, meta) {
  const changes = policyDiff(ex, fields, meta.clearEmpty);
  if (!Object.keys(changes).length) return {unchanged: true};
  const at = nowISO(), version = (ex.version || 1) + 1;
  const patch = Object.fromEntries(Object.entries(changes).map(([k,[,n]]) => [k, n]));
  Object.assign(patch, {
    version, updatedAt: at, asOf: meta.asOf || at, source: meta.source, sourceGroup: meta.sourceGroup || '',
    history: [...(ex.history || []), {version, at, by: state.user.name, source: meta.source, sourceGroup: meta.sourceGroup || '', changes, excerpt: meta.excerpt || ''}].slice(-40),
  });
  await S.update('policies', ex.id, patch);
  return {updated: true, changes};
}
async function upsertPolicy({bank, product, fields, notes}, meta) {
  const all = {...fields}; if (notes !== undefined) all.notes = notes;
  const ex = findPolicy(bank, product);
  if (ex) return applyPolicyChange(ex, all, meta);
  const at = nowISO();
  const kept = Object.fromEntries(Object.entries(all).filter(([,v]) => v !== null && v !== undefined && v !== ''));
  const created = Object.fromEntries(Object.entries(kept).filter(([k]) => !['active','notes'].includes(k)).map(([k,v]) => [k, [null, v]]));
  await S.add('policies', {bank, product, active: true, ...kept, version: 1, createdAt: at, updatedAt: at, asOf: meta.asOf || at,
    source: meta.source, sourceGroup: meta.sourceGroup || '',
    history: [{version: 1, at, by: state.user.name, source: meta.source, sourceGroup: meta.sourceGroup || '', changes: created, excerpt: meta.excerpt || ''}]});
  return {created: true};
}

const UNIT = '(crores?|cr|lakhs?|lacs?|lac|l|k)?';
const toLakh = (v,u) => { v = +v; u = (u||'').toLowerCase(); if (/^cr/.test(u)) return v*100; if (/^(l|lac|lakh)/.test(u)) return v; if (u === 'k') return v/100; return v >= 1000 ? v/1e5 : v; };
const toRupees = (v,u) => { v = +v; u = (u||'').toLowerCase(); if (/^cr/.test(u)) return v*1e7; if (/^(l|lac|lakh)/.test(u)) return v*1e5; if (u === 'k') return v*1e3; return v; };

function detectBanks(t) { const hits = []; for (const [name, rx] of BANKS) { const m = t.match(rx); if (m) hits.push([m.index, name]); } return hits.sort((a,b) => a[0]-b[0]).map(h => h[1]); }
const firstMatch = (list, t) => { for (const [name, rx] of list) if (rx.test(t)) return name; return ''; };
const detectProduct = t => firstMatch(PRODUCT_RX, t);
const detectDesig = t => firstMatch(DESIG, t);
const detectCity = t => firstMatch(CITIES, t);
const detectCities = t => CITIES.filter(([, rx]) => rx.test(t)).map(([n]) => n);
const detectGeo = t => { const m = t.match(/(\d{2,3})\s*-?\s*kms?\b/i); return m ? `${m[1]} km` : ''; };
const uniq = a => [...new Set((a || []).filter(Boolean))];
const parseList = v => uniq(String(v || '').split(/[,\n;]+/).map(x => x.trim()).filter(Boolean).map(x => CITY_NAMES.find(c => c.toLowerCase() === x.toLowerCase()) || x));

function extractPolicyFields(text) {
  const t = text.toLowerCase().replace(/(\d),(?=\d)/g, '$1');
  const f = {}; let m;
  if ((m = t.match(/(?:cibil|bureau|credit\s*score)(?:\s*score)?\s*[:\-–>=]*\s*(?:min(?:imum)?\.?\s*)?(?:of\s*)?(\d{3})/))) { const v = +m[1]; if (v >= 300 && v <= 900) f.minCibil = v; }
  if ((m = t.match(/(?:\broi\b|rate\s*of\s*interest|interest\s*rate)\s*(?:starts?|starting)?\s*(?:from|@|at)?\s*[:\-–@]*\s*(\d{1,2}(?:\.\d{1,2})?)\s*%?(?:\s*(?:-|to|–)\s*(\d{1,2}(?:\.\d{1,2})?)\s*%?)?/))) {
    const a = +m[1]; if (a >= 5 && a <= 40) { f.roiMin = a; if (m[2] && +m[2] >= a && +m[2] <= 48) f.roiMax = +m[2]; } }
  if ((m = t.match(/(?:tenure|tenor)\s*[:\-–]*\s*(?:up\s*to|upto|max(?:imum)?\.?|till)?\s*(\d{1,3})\s*(months?|mths?|m\b|years?|yrs?|y\b)/))) { let v = +m[1]; if (/^y/.test(m[2])) v *= 12; if (v >= 3 && v <= 360) f.tenureMaxMonths = v; }
  if ((m = t.match(/(?:vintage|existence)\s*[:\-–]*\s*(?:of\s*)?(?:min(?:imum)?\.?\s*)?(\d{1,2}(?:\.\d)?)\s*\+?\s*(years?|yrs?|y\b|months?|mths?)?/))) { let v = +m[1]; if (m[2] && /^m/.test(m[2])) v = v/12; if (v <= 30) f.minVintageYrs = r2(v); }
  if ((m = t.match(new RegExp(`(?:turnover|t\\/o)\\s*[:\\-–]*\\s*(?:of\\s*)?(?:min(?:imum)?\\.?\\s*)?(?:rs\\.?|₹|inr)?\\s*(\\d+(?:\\.\\d+)?)\\s*${UNIT}\\b`)))) { const v = toLakh(m[1], m[2]); if (v > 0) f.minTurnoverLakh = r2(v); }
  if ((m = t.match(new RegExp(`(?:\\babb\\b|avg\\.?\\s*bank\\s*balance|average\\s*bank\\s*balance)\\s*[:\\-–]*\\s*(?:of\\s*)?(?:min(?:imum)?\\.?\\s*)?(?:rs\\.?|₹)?\\s*(\\d+(?:\\.\\d+)?)\\s*${UNIT}\\b`)))) { const v = toRupees(m[1], m[2]); if (v > 0) f.minAbb = Math.round(v); }
  if ((m = t.match(new RegExp(`(?:loan\\s*amount|ticket\\s*size|loan\\s*size|amount)\\s*[:\\-–]*\\s*(?:rs\\.?|₹)?\\s*(\\d+(?:\\.\\d+)?)\\s*${UNIT}\\s*(?:-|to|–)\\s*(?:rs\\.?|₹)?\\s*(\\d+(?:\\.\\d+)?)\\s*${UNIT}\\b`)))) {
    const u = m[2] || m[4]; f.loanMinLakh = r2(toLakh(m[1], u)); f.loanMaxLakh = r2(toLakh(m[3], m[4] || u)); }
  else if ((m = t.match(/(?:loan|amount|funding|ticket)[^.\n%]{0,20}?(?:up\s*to|upto|max(?:imum)?\.?)\s*(?:rs\.?|₹)?\s*(\d+(?:\.\d+)?)\s*(crores?|cr|lakhs?|lacs?|lac|l)\b/))) f.loanMaxLakh = r2(toLakh(m[1], m[2]));
  if ((m = t.match(/\bfoir\s*[:\-–]*\s*(?:up\s*to|upto|max(?:imum)?\.?)?\s*(\d{2})\s*%?/))) f.foirMax = +m[1];
  if ((m = t.match(/(?:\bpf\b|processing\s*fees?|processing\s*charges?)\s*[:\-–@]*\s*(\d(?:\.\d{1,2})?)\s*%/))) f.pfPct = +m[1];
  if (/(?:\bno|without|non)[\s-]*itr|itr\s*(?:is\s*)?(?:not|no)\s*(?:required|mandatory|needed|req)/.test(t)) f.itrRequired = false;
  else if (/itr\s*(?:is\s*)?(?:required|mandatory|must|needed|compulsory|req\b|\d)/.test(t)) f.itrRequired = true;
  if (/(?:\bno|without|non)[\s-]*gst|gst\s*(?:is\s*)?(?:not|no)\s*(?:required|mandatory|needed|req)/.test(t)) f.gstRequired = false;
  else if (/gst\s*(?:is\s*)?(?:required|mandatory|must|needed|compulsory|registered|registration|returns?)/.test(t)) f.gstRequired = true;
  return f;
}

const STOP_RX = /\b(?:contact|call|whatsapp|mob(?:ile)?|ph(?:one)?|no|number|sir|madam|hi|hello|all|team|please|pls|for|any|loan|loans|bank|finance|finserv|capital|ltd|policy|update|new|dsa|group|and|the|at|in|from|is|my|our|details?)\b/g;
const NAME_STOP = /^(?:from|at|with|here|working|in|of|the|and|sales|credit|branch|relationship|area|rm|sm|bm|asm|manager|executive)$/i;
function selfName(text) {
  const m = text.match(/\b(?:i am|i'm|this is|myself)\s+([A-Za-z][A-Za-z.]+(?:\s+[A-Za-z][A-Za-z.]+){0,2})/i);
  if (!m) return '';
  const words = []; for (const w of m[1].split(/\s+/)) { if (NAME_STOP.test(w)) break; words.push(w.replace(/\.$/,'')); }
  return words.length ? titleCase(words.join(' ')) : '';
}
function guessName(ctx) {
  const self = selfName(ctx); if (self) return self;
  const parts = ctx.split(/\s[-–|]\s|[|,:;()\/\n]|\s{2,}/).map(s => s.replace(/[*_~]/g,'').trim()).filter(Boolean);
  for (const p of parts) {
    if (!/^[a-z][a-z.\s']{1,40}$/i.test(p) || p.split(/\s+/).length > 4) continue;
    const l = p.toLowerCase();
    if (detectBanks(l).length || detectDesig(l) || detectProduct(l) || detectCity(l)) continue;
    STOP_RX.lastIndex = 0; if (STOP_RX.test(l)) continue;
    return titleCase(p);
  }
  // Fallback: strip known tokens and see if a short name is left ("Lendingkart Vizag RM Pradeep")
  for (const p of parts) {
    let s = p.toLowerCase();
    for (const list of [BANKS, DESIG, CITIES, PRODUCT_RX]) for (const [, rx] of list) s = s.replace(new RegExp(rx.source, 'g'), ' ');
    s = s.replace(STOP_RX, ' ').replace(/[^a-z.\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const w = s.split(' ').filter(x => x.length >= 2);
    if (w.length >= 1 && w.length <= 3) return titleCase(w.join(' '));
  }
  return '';
}

const PHONE_RX = /(?:\+?91[\s-]?|\b0)?([6-9]\d{4}[\s-]?\d{5}|[6-9]\d{2}[\s-]?\d{3}[\s-]?\d{4})\b/g;
function extractContacts(m, msgBanks) {
  const out = [], low = m.text.toLowerCase();
  for (const line of m.text.split('\n')) {
    PHONE_RX.lastIndex = 0; let mm;
    while ((mm = PHONE_RX.exec(line))) {
      const ph = digits10(mm[1]); if (!ph) continue;
      const ctx = line.replace(mm[0], ' '), lctx = ctx.toLowerCase();
      const bank = detectBanks(lctx)[0] || (msgBanks.length === 1 ? msgBanks[0] : '');
      const desig = detectDesig(lctx) || detectDesig(low);
      const name = guessName(ctx);
      out.push({phone:'+91'+ph, name, bank, designation: desig, product: detectProduct(lctx) || '', city: detectCity(lctx) || detectCity(low), locations: detectCities(low), geo: detectGeo(low),
        conf: Math.min(.95, .2 + (name ? .3 : 0) + (bank ? .3 : 0) + (desig ? .15 : 0)), dt: m.dt, excerpt: line.trim().slice(0,200)});
    }
  }
  // Sender saved only as a number who introduces themselves as a banker
  const sd = digits10(m.sender);
  if (sd && /^[+\d\s\-()]+$/.test(m.sender)) {
    const bank = msgBanks[0] || '', desig = detectDesig(low);
    if (bank || desig) {
      const name = selfName(m.text);
      out.push({phone:'+91'+sd, name, bank, designation: desig, product: detectProduct(low) || '', city: detectCity(low), locations: detectCities(low), geo: detectGeo(low),
        conf: Math.min(.95, .25 + (name ? .25 : 0) + (bank ? .3 : 0) + (desig ? .15 : 0)), dt: m.dt, excerpt: m.text.trim().slice(0,200)});
    }
  }
  return out;
}

function parseChat(text) {
  const lines = text.replace(/\r/g,'').split('\n').map(l => l.replace(/[‎‏‪-‮﻿]/g,''));
  const head = /^\[?(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?\s?m\.?)?\]?\s*(?:[-–]\s*)?(.*)$/i;
  // Day/month order: Indian exports are d/m/y; switch to m/d/y if the file proves it.
  let dmy = true;
  for (const l of lines) { const m = l.match(head); if (!m) continue; if (+m[1] > 12) { dmy = true; break; } if (+m[2] > 12) { dmy = false; break; } }
  const msgs = []; let cur = null;
  for (const line of lines) {
    const m = line.match(head);
    if (m) {
      const [, a, b, y, hh, mm, ss, ap, rest] = m;
      const day = dmy ? +a : +b, mon = dmy ? +b : +a; let yr = +y; if (yr < 100) yr += 2000;
      let h = +hh; const apx = (ap || '').toLowerCase().replace(/[.\s]/g,'');
      if (apx === 'pm' && h < 12) h += 12; if (apx === 'am' && h === 12) h = 0;
      const dt = new Date(yr, mon-1, day, h, +mm, +(ss||0));
      const sm = rest.match(/^([^:]{1,60}?):\s?([\s\S]*)$/);
      if (!sm || isNaN(dt)) { cur = null; continue; }    // system line (joined, left, encryption notice…)
      cur = {dt: dt.toISOString(), sender: sm[1].trim(), text: sm[2]}; msgs.push(cur);
    } else if (cur) cur.text += '\n' + line;
  }
  return msgs.filter(m => { const t = m.text.trim(); return t && !/^<media omitted>$|omitted>?$|^this message was deleted$|^you deleted this message$|^null$/i.test(t); });
}

function mergeContact(a, b) {
  const [hi, lo] = a.conf >= b.conf ? [a, b] : [b, a];
  const out = {...hi};
  for (const k of ['name','bank','designation','product','city','geo']) if (!out[k] && lo[k]) out[k] = lo[k];
  out.locations = uniq([...(a.locations || []), ...(b.locations || [])]);
  out.dt = a.dt > b.dt ? a.dt : b.dt;
  return out;
}

function analyseChat(text, sinceISO) {
  const all = parseChat(text);
  const msgs = sinceISO ? all.filter(m => m.dt > sinceISO) : all;
  const props = new Map(), contacts = new Map();
  for (const m of msgs) {
    const low = m.text.toLowerCase();
    const banks = detectBanks(low);
    const fields = extractPolicyFields(m.text);
    const nf = Object.keys(fields).length;
    if (banks.length && nf >= 2) {
      const product = detectProduct(low);
      const bank = banks[0], key = bank + '|' + (product || 'Business Loan');
      const conf = Math.max(.2, Math.min(.97, .35 + nf*.1 + (product ? .12 : 0) - (banks.length > 1 ? .25 : 0)));
      const warn = [banks.length > 1 ? `Also mentions ${banks.slice(1).join(', ')} — check the lender.` : '', !product ? 'Product not stated — set to Business Loan.' : ''].filter(Boolean).join(' ');
      const prev = props.get(key), locations = detectCities(low), geo = detectGeo(low);
      props.set(key, prev
        ? {...prev, fields: {...prev.fields, ...fields}, locations: uniq([...(prev.locations || []), ...locations]), geo: geo || prev.geo, dt: m.dt, sender: m.sender, excerpt: m.text.slice(0,600), conf: Math.max(prev.conf, conf), warn: warn || prev.warn}
        : {bank, product: product || 'Business Loan', fields, locations, geo, dt: m.dt, sender: m.sender, excerpt: m.text.slice(0,600), conf, warn});
    }
    for (const c of extractContacts(m, banks)) {
      const k = digits10(c.phone), prev = contacts.get(k);
      contacts.set(k, prev ? mergeContact(prev, c) : c);
    }
  }
  const pre = c => ({...c, sel: c.conf >= .6});
  return {
    policies: [...props.values()].map(pre),
    contacts: [...contacts.values()].map(pre),
    stats: {total: all.length, messages: msgs.length, skipped: all.length - msgs.length,
      senders: new Set(msgs.map(m => m.sender)).size, fromISO: msgs[0]?.dt || '', toISO: msgs[msgs.length-1]?.dt || ''},
  };
}

async function applyDraft(onlyHigh = false) {
  const d = state.imp.draft, st = settings();
  const group = clip(state.imp.group, 80) || 'Unnamed group';
  const pick = x => !x.applied && (onlyHigh ? x.conf >= st.autoApplyMin : x.sel);
  const r = {pc:0, pu:0, ps:0, cn:0, cu:0};
  for (const p of d.policies.filter(pick)) {
    const ex = findPolicy(p.bank, p.product);
    if (ex && ex.asOf && p.dt < ex.asOf) { r.ps++; p.applied = true; continue; }   // never overwrite newer info with an older message
    const res = await upsertPolicy({bank: p.bank, product: p.product, fields: {...p.fields, ...(p.locations?.length ? {locations: uniq(p.locations)} : {}), ...(p.geo ? {geo: p.geo} : {})}, notes: p.notes}, {source:'WhatsApp', sourceGroup: p.group || group, excerpt: String(p.excerpt || '').slice(0,400), asOf: p.dt});
    if (res.created) r.pc++; else if (res.updated) r.pu++;
    p.applied = true;
  }
  for (const c of d.contacts.filter(pick)) {
    const ex = S.all('bankers').find(b => digits10(b.phone) === digits10(c.phone));
    const data = {name: clip(c.name,80), bank: clip(c.bank,60), designation: clip(c.designation,60), product: c.product || '', city: clip(c.city,40)};
    if (ex) {
      const patch = {lastSeen: c.dt > (ex.lastSeen || '') ? c.dt : ex.lastSeen, sourceGroup: ex.sourceGroup || c.group || group};
      for (const k of Object.keys(data)) if (!ex[k] && data[k]) patch[k] = data[k];
      const locs = uniq([...(ex.locations || []), ...(c.locations || [])]);
      if (locs.length !== (ex.locations || []).length) patch.locations = locs;
      if (!ex.geo && c.geo) patch.geo = c.geo;
      await S.update('bankers', ex.id, patch); r.cu++;
    } else {
      await S.add('bankers', {...data, locations: uniq(c.locations), geo: c.geo || '', phone: e164(c.phone), email:'', notes: c.notes || '', sourceGroup: c.group || group, verified:false, dnc:false, firstSeen: c.dt, lastSeen: c.dt, createdAt: nowISO()}); r.cn++;
    }
    c.applied = true;
  }
  // Group + import log (an import file can cover several groups)
  if (d.groups?.length && !d.recorded) {
    for (const gg of d.groups) {
      const ex = S.all('groups').find(x => x.name === gg.name);
      const gp = {name: gg.name, lastImportAt: nowISO(), lastImportBy: state.user.name, messages: (ex?.messages || 0) + (gg.messages || 0), members: Math.max(ex?.members || 0, gg.members || 0),
        lastMessageAt: !ex?.lastMessageAt || (gg.lastMessageAt || '') > ex.lastMessageAt ? (gg.lastMessageAt || ex?.lastMessageAt || '') : ex.lastMessageAt,
        policiesFound: (ex?.policiesFound || 0) + d.policies.filter(p => p.group === gg.name && p.applied).length, contactsFound: (ex?.contactsFound || 0) + d.contacts.filter(c => c.group === gg.name && c.applied).length};
      if (ex) await S.update('groups', ex.id, gp); else await S.add('groups', {...gp, createdAt: nowISO()});
    }
    await S.add('imports', {group: `${d.groups.length} groups (WhatsApp Web scan)`, at: nowISO(), by: state.user.name, file: state.imp.fileName, messages: d.stats.messages, from: d.stats.fromISO, to: d.stats.toISO});
    d.recorded = true;
  }
  if (d.groups?.length) { d.policies = d.policies.filter(p => !p.applied); d.contacts = d.contacts.filter(c => !c.applied); return r; }
  const g = S.all('groups').find(x => x.name === group), s = d.stats;
  const gp = {name: group, lastImportAt: nowISO(), lastImportBy: state.user.name,
    policiesFound: (g?.policiesFound || 0) + r.pc + r.pu, contactsFound: (g?.contactsFound || 0) + r.cn + r.cu};
  if (!d.recorded) {
    gp.lastMessageAt = !g?.lastMessageAt || s.toISO > g.lastMessageAt ? s.toISO : g.lastMessageAt;
    gp.messages = (g?.messages || 0) + s.messages;
    gp.members = Math.max(g?.members || 0, s.senders);
    await S.add('imports', {group, at: nowISO(), by: state.user.name, file: state.imp.fileName, messages: s.messages, from: s.fromISO, to: s.toISO});
    d.recorded = true;
  }
  if (g) await S.update('groups', g.id, gp); else await S.add('groups', {messages:0, members:0, ...gp, createdAt: nowISO()});
  d.policies = d.policies.filter(p => !p.applied);
  d.contacts = d.contacts.filter(c => !c.applied);
  return r;
}

// Screenshot reading (OCR) for chat exports made "With media". Runs in the browser; images never leave the device.
const OCR_MAX = 60;
let tessPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return tessPromise ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = () => res(window.Tesseract); s.onerror = () => { tessPromise = null; rej(new Error('Could not load the screenshot reader. Check the internet and try again.')); };
    document.head.append(s);
  });
}
// Reads every screenshot the chat refers to and puts its text under that message,
// indented so it is never mistaken for a new message line.
async function ocrChatImages(zip, text, onStep) {
  const IMG = /\.(jpe?g|png|webp)$/i, REF = /([\w\-]+\.(?:jpe?g|png|webp))/gi;
  const files = new Map(Object.values(zip.files).filter(z => !z.dir && IMG.test(z.name)).map(z => [z.name.split('/').pop(), z]));
  if (!files.size) return {text, read: 0, found: 0};
  const names = [...new Set([...text.matchAll(REF)].map(m => m[1]).filter(n => files.has(n)))];
  const todo = names.slice(-OCR_MAX);   // newest screenshots first matter most
  if (!todo.length) return {text, read: 0, found: files.size};
  const T = await loadTesseract(), worker = await T.createWorker('eng');
  const out = {};
  try {
    for (let i = 0; i < todo.length; i++) {
      onStep?.(i + 1, todo.length);
      try { const {data} = await worker.recognize(await files.get(todo[i]).async('blob')); out[todo[i]] = String(data.text || '').trim(); }
      catch (e) { console.warn('OCR failed', todo[i], e); }
    }
  } finally { await worker.terminate(); }
  const lines = text.split('\n').map(l => {
    const name = [...l.matchAll(REF)].map(m => m[1]).find(n => out[n]);
    return name ? l + '\n' + out[name].split('\n').map(x => x.trim()).filter(Boolean).map(x => '  ' + x).join('\n') : l;
  });
  return {text: lines.join('\n'), read: Object.values(out).filter(Boolean).length, found: names.length, skipped: names.length - todo.length};
}

let jszipPromise = null;
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return jszipPromise ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => res(window.JSZip); s.onerror = () => rej(new Error('Could not load the zip reader — unzip the file and upload the .txt'));
    document.head.append(s);
  });
}

const navFor = role => NAV.filter(n => n.id && n.roles.includes(role));
const canSee = id => navFor(state.user.role).some(n => n.id === id);
const yn = v => v === true ? 'Yes' : v === false ? 'No' : '—';
const dash = v => (v == null || v === '') ? '—' : esc(v);
const roiText = p => num(p.roiMin) ? `${esc(p.roiMin)}${num(p.roiMax) ? '–' + esc(p.roiMax) : '+'}%` : '—';
const loanRange = p => (num(p.loanMinLakh) || num(p.loanMaxLakh)) ? `${num(p.loanMinLakh) ? fmtL(p.loanMinLakh) : '₹0'} – ${num(p.loanMaxLakh) ? fmtL(p.loanMaxLakh) : 'open'}` : '—';
const fmtField = (k,v) => Array.isArray(v) ? (v.length > 4 ? v.slice(0,4).join(', ') + ` +${v.length-4}` : v.join(', ') || '—') : typeof v === 'boolean' ? (v ? 'Yes' : 'No') : (v == null || v === '') ? '—' : String(v);
const diffChips = ch => Object.entries(ch || {}).filter(([k]) => k !== 'notes').slice(0,8).map(([k,[o,n]]) =>
  `<span class="chip up">${esc(FIELD_LABEL[k] || k)}: ${o == null || o === '' ? '' : esc(fmtField(k,o)) + ' → '}<b>&nbsp;${esc(fmtField(k,n))}</b></span>`).join('');
const freshBadge = p => `<span class="badge ${isStale(p) ? 'b-warn' : 'b-ok'}">${isStale(p) ? 'Stale · ' : 'Updated '}${esc(ago(p.asOf || p.updatedAt))}</span>`;
const confBadge = c => `<span class="badge ${c >= .8 ? 'b-ok' : c >= .6 ? 'b-warn' : 'b-bad'}">${c >= .8 ? 'High' : c >= .6 ? 'Medium' : 'Low'} ${Math.round(c*100)}%</span>`;
const stageBadge = s => `<span class="badge ${s === 'Disbursed' ? 'b-ok' : s === 'Lost' ? 'b-bad' : s === 'Rejected' ? 'b-warn' : s === 'Sanctioned' ? 'b-info' : ''}">${esc(s)}</span>`;
const statusBadge = s => `<span class="badge ${s === 'Approved' ? 'b-ok' : s === 'Rejected' ? 'b-bad' : 'b-warn'}">${esc(s || '—')}</span>`;
const locChips = (list, max = 6) => { const l = list || []; return l.length ? `<div class="chips">${l.slice(0,max).map(x => `<span class="chip">${esc(x)}</span>`).join('')}${l.length > max ? `<span class="chip">+${l.length - max} more</span>` : ''}</div>` : ''; };
const bankerCount = bank => S.all('bankers').filter(b => b.bank === bank && !b.dnc).length;
const bankerBtn = bank => { const n = bankerCount(bank); return n ? `<button class="btn sm" data-action="show-bankers" data-bank="${esc(bank)}">${ic('phone')} ${n} banker${n > 1 ? 's' : ''}</button>` : '<span class="small muted">No banker contact yet</span>'; };

// Bound inputs keep their value in `state`, so re-renders never lose typing.
function inp(label, path, o = {}) {
  const v = getPath(state, path) ?? '', id = 'f_' + path.replace(/\W/g,'_');
  const rr = o.rerender ? 'data-rerender' : '';
  const ctl = o.options

const docNeed = product => DOC_NEED[product] || ['Aadhaar','PAN','Bank statement'];
const DOC_MAX = 10 * 1024 * 1024;
const docOk = f => f.size <= DOC_MAX && (/^image\//.test(f.type) || f.type === 'application/pdf');
const fmtSize = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

const blobStore = {
  db: null,
  open() { return this.db ||= new Promise((res, rej) => { const q = indexedDB.open('dsa_cc_docs', 1); q.onupgradeneeded = () => q.result.createObjectStore('blobs'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('blobs', mode), st = tx.objectStore('blobs'), r = fn(st); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); }); },
  put(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  get(k) { return this.run('readonly', st => st.get(k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); },
};
async function putDocFile(path, file) {

function careData() {
  const t = todayStr(), win = num(settings().emiWindow) || 7, leads = S.all('leads');
  const disb = leads.flatMap(l => loanDisbursals(l).map(({d, li}) => ({l, d, li, e: emiInfo(d)})));
  const emiDue = disb.filter(x => x.e && !x.e.closed && daysUntil(x.e.next) >= 0 && daysUntil(x.e.next) <= win).sort((a,b) => a.e.next.localeCompare(b.e.next));
  const emiUnsent = emiDue.filter(x => x.d.remindedFor !== x.e.next);
  const topup = disb.filter(x => x.e && !x.e.closed && x.e.paid >= 3 && (!x.d.topupAt || daysSince(x.d.topupAt) >= 30)).sort((a,b) => b.e.paid - a.e.paid);
  const rejected = leads.filter(l => l.stage === 'Rejected').map(l => ({l, next: l.nurture?.nextDate || t, retry: l.rejection?.retryFrom || ''})).sort((a,b) => a.next.localeCompare(b.next));
  const retryDue = rejected.filter(x => x.next <= addDays(t, 3));
  return {disb, emiDue, emiUnsent, topup, rejected, retryDue};
}

    return {logins, disbursal: first ? {...first} : l.disbursal || null}; };
  if (kind === 'emi') { const e = emiInfo(loanOf(l, li)); return patchLoan({remindedFor: e?.next || ''}); }
  if (kind === 'topup') return patchLoan({topupAt: nowISO()});

}

const PERIODS = [['day','Daily'],['week','Weekly'],['month','Monthly'],['year','Yearly']];
function periodRange(kind, offset) {
  const n = new Date(); let s, e, label;
  const short = d => d.toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
  if (kind === 'day') { s = new Date(n.getFullYear(), n.getMonth(), n.getDate() + offset); e = new Date(s); e.setDate(s.getDate() + 1); label = s.toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}); }
  else if (kind === 'week') { const d = (n.getDay() + 6) % 7; s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - d + 7*offset); e = new Date(s); e.setDate(s.getDate() + 7); const last = new Date(e); last.setDate(e.getDate() - 1); label = `${short(s)} – ${short(last)} ${last.getFullYear()}`; }
  else if (kind === 'month') { s = new Date(n.getFullYear(), n.getMonth() + offset, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); label = s.toLocaleDateString('en-IN', {month:'long', year:'numeric'}); }
  else { s = new Date(n.getFullYear() + offset, 0, 1); e = new Date(s.getFullYear() + 1, 0, 1); label = String(s.getFullYear()); }
  return {s: s.toISOString(), e: e.toISOString(), label};
}
const stageEvents = l => (l.stageHistory && l.stageHistory.length) ? l.stageHistory : [{stage: l.stage, at: l.updatedAt || l.createdAt}];
function teamStats(r) {
  const inR = iso => iso && iso >= r.s && iso < r.e, t = todayStr();
  const people = S.all('staff').filter(p => p.role || p.status !== 'Pending');
  const blank = () => ({added:0, addedAmt:0, logged:0, sanctioned:0, sanctionedAmt:0, disbursed:0, disbursedAmt:0, rejected:0, lost:0, fuDone:0, overdue:0, checks:0, calls:0, interested:0, leads:[]});
  const rows = new Map(people.map(p => [p.id, {p, ...blank()}]));
  const row = id => { if (!rows.has(id)) rows.set(id, {p:{id, name:'Unassigned / removed', role:'', status:''}, ...blank()}); return rows.get(id); };
  for (const l of S.all('leads')) {
    const x = row(l.assignedTo), ev = stageEvents(l), amt = num(l.amountLakh); let touched = false;
    if (inR(l.createdAt)) { x.added++; x.addedAmt += amt; touched = true; }
    const hit = st => ev.some(h => h.stage === st && inR(h.at));
    if (hit('Logged In')) { x.logged++; touched = true; }
    if (hit('Sanctioned')) { x.sanctioned++; x.sanctionedAmt += amt; touched = true; }
    if (hit('Disbursed')) { x.disbursed++; x.disbursedAmt += loanDisbursals(l).reduce((a, y) => a + num(y.d.amountLakh), 0) || amt; touched = true; }
    if (hit('Rejected')) { x.rejected++; touched = true; }
    if (hit('Lost')) { x.lost++; touched = true; }
    if (!touched && ev.some(h => inR(h.at))) touched = true;
    if (touched) x.leads.push(l);
  }
  for (const f of S.all('followups')) {
    if (f.done && inR(f.doneAt)) row(f.doneBy || f.assignedTo).fuDone++;
    if (!f.done && f.date < t) row(f.assignedTo).overdue++;
  }
  for (const c of S.all('checks')) if (inR(c.createdAt)) row(c.createdBy).checks++;
  for (const c of S.all('calls')) if (callDone(c) && inR(c.calledAt)) { const x = row(c.createdBy); x.calls++; if (c.outcome === 'interested') x.interested++; }
  return [...rows.values()].filter(x => x.p.status !== 'Rejected' || x.leads.length)
    .sort((a,b) => b.disbursedAmt - a.disbursedAmt || b.added - a.added || String(a.p.name).localeCompare(String(b.p.name)));
}

// ---- Bank Statement Analysis (Ledger Lens, opened in its own tab; results come back by postMessage)

  const A = l.bankAnalysis, inr = v => '₹' + Math.round(num(v)).toLocaleString('en-IN');
  const btn = l.id ? `<button type="button" class="btn ${A ? '' : 'primary'}" data-action="bsa-open" data-lead="${esc(l.id)}">${ic('file')} ${A ? 'Re-analyse statements' : 'Analyse bank statement'}</button>` : '<span class="small muted">Save the lead first, then open it again to analyse its bank statements.</span>';
  if (!A) return `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${btn}<span class="small muted">Upload the customer's PDF statements; ABB, 6-month turnover and bounces fill in automatically.</span></div>`;
  return `<div class="card" style="box-shadow:none;background:var(--surface-2)">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><b style="flex:1">${esc((A.accounts || []).join(', ') || 'Statement')}${A.combined ? ' (combined)' : ''} · ${esc(A.periodStart || '')} – ${esc(A.periodEnd || '')} · ${num(A.monthsCount)} months</b>${btn}</div>
    <div class="kpis" style="margin:0 0 10px">
      <div class="card kpi"><div class="l">ABB (last 6 m)</div><div class="v">${inr(A.abb6m)}</div></div>
      <div class="card kpi"><div class="l">Turnover (last 6 m)</div><div class="v">₹${esc(A.turnover6mLakh)} L</div><div class="h">avg ${inr(A.avgMonthlyCredit)}/month</div></div>
      <div class="card kpi"><div class="l">Bounces</div><div class="v ${num(A.bounces6m) ? 'neg' : ''}">${num(A.bounces6m)} / ${num(A.bounces3m)}</div><div class="h">6 months / 3 months</div></div>
      <div class="card kpi"><div class="l">EMIs seen (recent)</div><div class="v">${inr(A.monthlyEmiRecent)}</div><div class="h">${(A.emis || []).length} lender(s) · pass-through ${num(A.passthroughPct)}%</div></div>
    </div>
    ${(A.emis || []).length ? `<div class="tw"><table><thead><tr><th>EMI to</th><th>Last EMI</th><th>Last date</th><th>Times</th></tr></thead><tbody>${A.emis.map(e => `<tr><td>${esc(e.lender)}${e.recent ? '' : ' <span class="badge">old</span>'}</td><td>${inr(e.lastAmount)}</td><td>${esc(e.lastDate)}</td><td>${num(e.count)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="small muted">No EMI / NACH debits found in the statement.</div>'}
    ${(A.loanCredits || []).length ? `<div class="small" style="margin-top:6px"><b>Loans credited:</b> ${A.loanCredits.map(c => `${esc(c.lender)} ${inr(c.amount)} (${esc(c.date)})`).join(' · ')}</div>` : ''}
    <details style="margin-top:8px"><summary class="small">Month-wise credit, debit and ABB</summary><div class="tw"><table><thead><tr><th>Month</th><th>Credit</th><th>Debit</th><th>ABB</th></tr></thead><tbody>${(A.monthly || []).map(m => `<tr><td>${esc(m.label)}</td><td>${inr(m.credit)}</td><td>${inr(m.debit)}</td><td>${inr(m.abb)}</td></tr>`).join('')}</tbody></table></div></details>
    <div class="small muted" style="margin-top:6px">Analysed ${esc(fmtDate(String(A.analysedAt || '').slice(0, 10)))}${A.by ? ' by ' + esc(A.by) : ''}. The statement itself is not stored, only these figures.</div></div>`;
}
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'ledgerlens-result') return;
  const reply = m => { try { e.source?.postMessage({type: 'ledgerlens-saved', leadId: e.data.leadId, ...m}, location.origin); } catch (x) { /* tab closed */ } };
  const l = byId('leads', e.data.leadId), A = e.data.summary;
  if (!l || !A) return reply({ok: false, error: 'This lead is not open in the CRM any more. Open the lead and try again.'});
  const P = l.profile || {}, n = v => (v == null || isNaN(+v)) ? null : +v;
  const bankAnalysis = {...A, by: state.user?.name || '', byPhone: state.user?.phone || ''};
  const profile = {...P, abb: n(A.abb6m), turnover6m: n(A.turnover6mLakh), bounces6m: n(A.bounces6m), bounces3m: n(A.bounces3m)};
  S.update('leads', l.id, {bankAnalysis, profile, updatedAt: nowISO()}).then(() => {
    const form = document.getElementById('lead-form');
    if (form && form.querySelector('[name="id"]')?.value === l.id) {
      const set = (k, v) => { const f = form.querySelector(`[name="${k}"]`); if (f && v != null) f.value = v; };
      set('abb', profile.abb); set('turnover6m', profile.turnover6m); set('bounces6m', profile.bounces6m); set('bounces3m', profile.bounces3m);
      const box = form.querySelector('#bsa-box'); if (box) box.innerHTML = bsaCard({...l, bankAnalysis});
    }
    toast(`Bank statement analysis saved for ${l.name}`, 'ok');
    reply({ok: true, abb: profile.abb, turnover: profile.turnover6m, b6: profile.bounces6m, b3: profile.bounces3m});
  }).catch(err => { console.error(err); toast(friendly(err), 'bad'); reply({ok: false, error: friendly(err)}); });
});

// ---- Follow-ups
function fuList(arr, done = false, drafts = false) {
  return `<div class="list">${arr.map(f => {
    const l = byId('leads', f.leadId), t = l ? tplForStage(l.stage) : null, sent = lastSent(l), sentToday = sent && sent.at.slice(0,10) === todayStr();
    return `<div class="li"><div class="grow"><div class="strong">${esc(f.leadName)} ${l ? stageBadge(l.stage) : ''}</div><div class="small muted">${fmtDate(f.date)}${f.time ? ` · ${esc(f.time)}` : ''}${f.assignedName ? ` · ${esc(f.assignedName)}` : ''}</div><div class="small" style="margin-top:2px">${esc(f.remarks)}</div>
      ${drafts && !done && l && t ? `<div class="draft" title="${esc(t.name)}">${esc(fillTpl(t.body, l))}</div><div class="draft-actions"><span class="small muted">Draft: ${esc(t.name)}</span>${sent ? `<span class="badge ${sentToday ? 'b-ok' : ''}">${sentToday ? 'Sent today' : 'Last sent ' + esc(ago(sent.at))}</span>` : ''}</div>` : ''}</div>
    ${done ? '<span class="badge b-ok">Done</span>' : `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${l ? `<button class="btn sm wa" data-action="wa-quick" data-lead="${esc(l.id)}" data-fu="${esc(f.id)}" title="Send the draft in WhatsApp">${ic('send')} Send</button><button class="btn sm" data-action="wa-compose" data-lead="${esc(l.id)}" data-fu="${esc(f.id)}">Edit draft</button>` : ''}<button class="btn sm" data-action="fu-done" data-id="${esc(f.id)}">${ic('check')} Done</button></div>`}</div>`; }).join('')}</div>`;
}
function vFollow() {
  const t = todayStr(), all = S.all('followups'), open = all.filter(f => !f.done).sort(byDate);
  const over = open.filter(f => f.date < t), tod = open.filter(f => f.date === t), up = open.filter(f => f.date > t);
  const done = all.filter(f => f.done).sort((a,b) => String(b.doneAt || '').localeCompare(String(a.doneAt || ''))).slice(0,8);
  const leads = S.all('leads').filter(l => !['Disbursed','Lost'].includes(l.stage));
  const sec = (title, arr, b) => `<div class="card"><h3>${title} <span class="badge ${b}">${arr.length}</span></h3>${arr.length ? fuList(arr, false, true) : '<div class="empty small">None</div>'}</div>`;
  const dueN = over.length + tod.length;
  return header('Follow-ups', `${open.length} open · each has a ready WhatsApp draft based on the file's stage`, dueN ? `<button class="btn wa" data-action="fu-queue">${ic('send')} Send ${dueN} due drafts one by one</button>` : '') + `<div class="split"><div class="card"><h3>Schedule a follow-up</h3>
    ${leads.length ? `<form data-form="fu-add" class="stack" style="margin-top:0"><div><label>Lead</label><select name="leadId" required>${leads.map(l => `<option value="${esc(l.id)}">${esc(l.name)} · ${esc(l.product)}</option>`).join('')}</select></div>
      <div class="fg" style="grid-template-columns:1fr 1fr"><div><label>Date</label><input type="date" name="date" required value="${t}"></div><div><label>Time</label><input type="time" name="time" value="11:00"></div></div>
      <div><label>What to do</label><textarea name="remarks" rows="3" maxlength="500" required placeholder="e.g. Collect 12-month bank statement"></textarea></div><button class="btn primary">Add follow-up</button></form>` : '<div class="empty">Add an open lead first.</div>'}
    </div><div class="grid">${sec('Overdue', over, 'b-bad')}${sec('Today', tod, 'b-warn')}${sec('Upcoming', up, 'b-info')}
    ${(() => { const has = new Set(open.map(f => f.leadId)), none = leads.filter(l => !has.has(l.id) && l.stage !== 'Rejected');
      return `<div class="card"><h3>Open files with no follow-up <span class="badge ${none.length ? 'b-warn' : ''}">${none.length}</span></h3>${none.length ? `<p class="small muted" style="margin:-4px 0 8px">Every open file should have a next step. Schedule one for tomorrow 11:00 in one click.</p><div class="list">${none.map(l => `<div class="li"><div class="grow"><div class="strong">${esc(l.name)} ${stageBadge(l.stage)}</div><div class="small muted">${esc(l.product)} · ${fmtL(l.amountLakh)}${l.assignedName ? ' · ' + esc(l.assignedName) : ''}${l.logins?.length ? ' · ' + l.logins.map(g => esc(g.lender) + ': ' + esc(g.status)).join(', ') : ''}</div></div><button class="btn sm" data-action="fu-quick" data-lead="${esc(l.id)}">${ic('plus')} Tomorrow 11:00</button></div>`).join('')}</div>` : '<div class="empty small">All open files have a follow-up.</div>'}</div>`; })()}
    <div class="card"><h3>Recently completed</h3>${done.length ? fuList(done, true) : '<div class="empty small">Nothing yet.</div>'}</div></div></div>`;
}

let rendering = false;

  const a = document.activeElement, fid = a && a.id && root.contains(a) ? a.id : null;
  let sel = null; try { if (fid && typeof a.selectionStart === 'number') sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  root.innerHTML = state.user ? viewShell() : viewLogin();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({preventScroll: true}); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  } finally { rendering = false; }
}

// ---- 2Factor OTP (server side lives in /functions)
async function otpApi(path, body) {
  if (!OTP_API) throw new Error('OTP service is not set up yet: add the functions URL to OTP_API in index.html.');
  let r;
  try { r = await fetch(`${OTP_API.replace(/\/$/, '')}/${path}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); }
  catch (e) { throw new Error('Could not reach the OTP service. Check your internet connection.'); }
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(data.message || `OTP service error (${r.status})`); err.code = data.code; throw err; }
  return data;
}
let resendTimer = null;
function startResendTimer(sec) {
  const L = state.login; L.resendIn = sec; clearInterval(resendTimer);
  resendTimer = setInterval(() => { L.resendIn = Math.max(0, L.resendIn - 1); if (!L.resendIn) clearInterval(resendTimer); if (!state.user && L.step === 'otp') { const b = document.querySelector('[data-action="otp-resend"]'); if (b) { b.disabled = L.resendIn > 0; b.textContent = L.resendIn > 0 ? `Resend OTP in ${L.resendIn}s` : 'Resend OTP'; } } }, 1000);
}
async function sendTwoFactor() {
  const L = state.login; L.err = ''; L.busy = true; render();
  try { const r = await otpApi('sendOtp', {phone: L.phone}); L.session = r.sessionId; L.step = 'otp'; startResendTimer(r.resendIn || 30); toast(`OTP sent to +91 ${L.phone}`, 'ok'); }
  catch (e) { L.err = e.message; if (e.code === 'wait') startResendTimer(30); }
  L.busy = false; render();
}

  // Calls: ~3 weeks of daily calling so the call register and reports have data
  const calls = [], FIRST = ['Ravi','Srinu','Lakshmi','Venkatesh','Padma','Suresh','Kavya','Naresh','Anil','Sujatha','Ramana','Bhaskar','Geetha','Prasad','Mounika','Hari','Rani','Kishore','Swapna','Chandu','Siva','Durga','Mahesh','Pavan','Sandhya'];

  const pickOut = () => { let r = rnd() * 100; for (const [k, w] of DIST) { if ((r -= w) < 0) return k; } return 'not_now'; };

        const recallDate = oc.days ? addDays(dStr, oc.days) : '';
        calls.push({id: 'cl' + (cn++), phone: '+91' + (9 - Math.floor(rnd() * 3)) + String(Math.floor(rnd() * 1e9)).padStart(9, '0'), name: pick(FIRST) + ' ' + pick(LAST), product: pick(PRODUCTS.slice(0, 6)), city: pick(cities),
          outcome: o, recallDate, notes: o === 'not_now' ? pick(['Needs funds after Sankranti','Call next month','Busy with season']) : o === 'recent' ? 'Took loan from bank last month' : '', calledAt: at.toISOString(), createdAt: at.toISOString(),
          createdBy: who, createdByName: st.name, branch: 'Gajuwaka HQ', assignedTo: who, recallDone: !!recallDate && recallDate < addDays(T, -3), leadId: ''});
      }
    }
  }
  for (const who of ['+919000000004','+919000000005','+919000000006']) { const st = staff.find(x => x.id === who); for (let k = 0; k < 12; k++) calls.push({id: 'cl' + (cn++), phone: '+919' + String(Math.floor(rnd() * 1e9)).padStart(9, '0'), name: pick(FIRST) + ' ' + pick(LAST), product: 'Business Loan', city: pick(cities), outcome: 'pending', recallDate: '', notes: '', calledAt: '', createdAt: nowISO(), createdBy: who, createdByName: st.name, branch: 'Gajuwaka HQ', assignedTo: who, recallDone: false, leadId: ''}); }
  return {
    staff, policies, bankers, leads, followups, calls,
    groups: [
      {id:'g1', name:'Vizag DSA Connect', members:48, messages:620, policiesFound:4, contactsFound:9, lastMessageAt: ago(6), lastImportAt: ago(6), lastImportBy:'B Dhana Lakshmi', createdAt: ago(60)},
      {id:'g2', name:'AP Loan Partners', members:112, messages:1340, policiesFound:7, contactsFound:15, lastMessageAt: ago(18), lastImportAt: ago(9), lastImportBy:'CH Appala Naidu', createdAt: ago(80)},
    ],

    checks,
    settings: [{id:'app', branches:['Gajuwaka HQ'], staleDays:30, autoApply:false, autoApplyMin:.8, company:'Cheyutha Multiway Services'}],

}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
async function boot() {
  if (state.mode === 'live') {
    try { FB = await loadFirebase(); }
    catch (e) { console.error(e); state.mode = 'demo'; state.login.step = 'phone'; toast('Could not load Firebase, so the demo is running instead.', 'bad'); }
  }
  if (state.mode === 'live') {
    S = new FireStoreAdapter(FB); S.onChange(scheduleRender);
    render();
    FB.A.onAuthStateChanged(FB.auth, async u => {
      S.stop(); state.user = null;
      if (!u) { state.login.step = 'phone'; return render(); }
      try {
        const phone = u.phoneNumber || (await u.getIdTokenResult()).claims.phone_number;
        if (!phone) { await FB.A.signOut(FB.auth); state.login.err = 'This account has no mobile number. Sign in again with OTP.'; return; }
        const snap = await FB.F.getDoc(FB.F.doc(FB.db, 'staff', phone));
        state.login.phone = digits10(phone);
        if (!snap.exists()) { if (OTP_PROVIDER === '2factor') { await FB.A.signOut(FB.auth); state.login.err = 'This number is not registered. Ask your admin to add you.'; return; } state.login.step = 'request'; return render(); }
        const s = snap.data();
        if (s.status !== 'Approved' || !s.role) { state.login.step = 'status'; state.login.status = s.status || 'Pending'; return render(); }
        signedIn({phone, name: s.name, role: s.role, branch: s.branch});
      } catch (e) { console.error(e); state.login.err = 'Could not read your staff profile. Check that firestore.rules are deployed.'; state.login.step = 'phone'; render(); }
    });
  } else {
    S = new LocalStore(); S.onChange(scheduleRender);
    seedDemoDocs();
    let saved = null; try { saved = sessionStorage.getItem('dsa_cc_demo_user'); } catch (e) {}
    const s = saved && S.db.staff.find(x => x.id === saved && x.status === 'Approved');
    if (s) signedIn({phone: s.id, name: s.name, role: s.role, branch: s.branch}); else render();
  }
}
boot();
